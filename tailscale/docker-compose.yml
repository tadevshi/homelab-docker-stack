services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-homelab
    hostname: homelab-ts
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?Define TS_AUTHKEY in the root .env file}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped
